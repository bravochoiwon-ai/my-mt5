<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>코딩 첫걸음 — 기초부터 심화까지</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d27;
    --panel2: #232733;
    --line: #2e3342;
    --text: #e6e9f0;
    --muted: #9aa3b2;
    --accent: #5b8cff;
    --accent2: #7c5cff;
    --ok: #36c98f;
    --warn: #ffb454;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(90deg, rgba(91,140,255,.08), rgba(124,92,255,.08));
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  .progress-wrap { margin-left: auto; min-width: 180px; }
  .bar { height: 8px; background: var(--panel2); border-radius: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .3s; }
  .progress-wrap small { color: var(--muted); }

  .layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 65px); }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  nav {
    border-right: 1px solid var(--line);
    padding: 16px 10px;
    overflow-y: auto;
  }
  .group-title { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 16px 10px 6px; }
  .lesson-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    background: transparent; border: none; color: var(--text);
    padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .lesson-btn:hover { background: var(--panel2); }
  .lesson-btn.active { background: var(--panel2); color: #fff; font-weight: 600; }
  .lesson-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  .lesson-btn.done .dot { background: var(--ok); }

  main { padding: 28px 32px; max-width: 860px; }
  h2 { font-size: 24px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin-top: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin: 18px 0; }
  .card h3 { margin: 0 0 8px; font-size: 16px; }
  code { background: var(--panel2); padding: 2px 6px; border-radius: 5px; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
  pre { background: #0b0d13; border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow-x: auto; }
  pre code { background: none; padding: 0; }

  .editor-label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  textarea.editor {
    width: 100%; min-height: 150px; resize: vertical;
    background: #0b0d13; color: #e6e9f0; border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 14px; line-height: 1.6;
    tab-size: 2;
  }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  button.btn {
    background: var(--accent); color: #fff; border: none; padding: 10px 18px;
    border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.btn:hover { filter: brightness(1.08); }
  button.ghost { background: var(--panel2); color: var(--text); }
  .output {
    margin-top: 12px; background: #0b0d13; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px;
    white-space: pre-wrap; min-height: 24px; color: #cfd6e4;
  }
  .feedback { margin-top: 10px; font-size: 14px; padding: 10px 14px; border-radius: 9px; display: none; }
  .feedback.show { display: block; }
  .feedback.ok { background: rgba(54,201,143,.12); color: var(--ok); border: 1px solid rgba(54,201,143,.3); }
  .feedback.no { background: rgba(255,107,107,.1); color: var(--err); border: 1px solid rgba(255,107,107,.3); }

  .nav-foot { display: flex; justify-content: space-between; margin: 30px 0 60px; }
  footer { color: var(--muted); font-size: 12px; padding: 16px 32px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <div>
    <h1>🚀 코딩 첫걸음</h1>
    <div class="sub">아무것도 몰라도 괜찮아요 · 기초부터 심화까지</div>
  </div>
  <div class="progress-wrap">
    <div class="bar"><i id="progbar"></i></div>
    <small id="progtext">0 / 0 완료</small>
  </div>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<footer>혼자서 배우는 코딩 — 직접 코드를 쓰고 [실행]을 눌러보세요. 진도는 자동 저장됩니다.</footer>

<script>
/* ---------------------------------------------------------------
   커리큘럼 데이터
   각 레슨: id, 그룹, 제목, 설명(html), 시작코드, 정답체크(check)
   check(output, code) -> true 면 통과
---------------------------------------------------------------- */
const LESSONS = [
  // ===== 기초 =====
  {
    id: "intro", group: "기초", title: "1. 코딩이란?",
    body: `
      <p class="lead">코딩은 <b>컴퓨터에게 시키는 일을 글로 적는 것</b>이에요. 어렵지 않습니다.</p>
      <div class="card">
        <h3>화면에 글자 보여주기</h3>
        <p>가장 먼저 배우는 건 "화면에 무언가 출력하기" 예요. 아래처럼 씁니다.</p>
        <pre><code>console.log("안녕하세요");</code></pre>
        <p><code>console.log( )</code> 안에 따옴표로 감싼 글자를 넣으면 그대로 보여줘요.</p>
      </div>
      <p>👉 아래 칸에 <code>console.log("나는 코딩을 배운다");</code> 를 써보세요.</p>`,
    start: '// 여기에 코드를 써보세요\n',
    check: (out) => out.includes("나는 코딩을 배운다")
  },
  {
    id: "var", group: "기초", title: "2. 변수 — 값을 담는 상자",
    body: `
      <p class="lead">변수는 값을 담아두는 <b>이름표 붙은 상자</b>예요.</p>
      <div class="card">
        <h3>변수 만들기</h3>
        <pre><code>let name = "철수";
console.log(name);</code></pre>
        <p><code>let 이름 = 값</code> 형태로 상자를 만들고, 그 이름을 부르면 안의 값이 나와요.</p>
      </div>
      <p>👉 <code>age</code> 라는 변수에 자기 나이를 넣고 <code>console.log(age)</code> 로 출력해보세요.</p>`,
    start: 'let age = \nconsole.log(age);',
    check: (out) => /\d+/.test(out.trim())
  },
  {
    id: "type", group: "기초", title: "3. 숫자와 글자",
    body: `
      <p class="lead">컴퓨터는 <b>숫자</b>와 <b>글자(문자열)</b>를 다르게 다뤄요.</p>
      <div class="card">
        <h3>숫자는 계산이 되고, 글자는 따옴표</h3>
        <pre><code>let a = 10;        // 숫자
let b = "10";      // 글자(문자열)
console.log(a + 5);   // 15
console.log(b + 5);   // "105" (글자 뒤에 붙음)</code></pre>
      </div>
      <p>👉 <code>3 + 4</code> 의 결과를 출력해서 <b>7</b>이 나오게 해보세요.</p>`,
    start: 'console.log( );',
    check: (out) => out.trim().split(/\s+/).includes("7")
  },
  // ===== 중급 =====
  {
    id: "if", group: "중급", title: "4. 조건문 — 만약에",
    body: `
      <p class="lead">"만약 ~라면 이걸 해라" 를 코드로 쓰는 게 조건문이에요.</p>
      <div class="card">
        <h3>if 문</h3>
        <pre><code>let score = 80;
if (score >= 60) {
  console.log("합격");
} else {
  console.log("불합격");
}</code></pre>
      </div>
      <p>👉 <code>score</code> 를 <b>50</b>으로 바꿔서 "불합격" 이 나오게 해보세요.</p>`,
    start: 'let score = 80;\nif (score >= 60) {\n  console.log("합격");\n} else {\n  console.log("불합격");\n}',
    check: (out) => out.includes("불합격")
  },
  {
    id: "loop", group: "중급", title: "5. 반복문 — 여러 번 하기",
    body: `
      <p class="lead">같은 일을 여러 번 시킬 땐 반복문을 써요. 복사붙여넣기 안 해도 돼요!</p>
      <div class="card">
        <h3>for 반복문</h3>
        <pre><code>for (let i = 1; i <= 3; i++) {
  console.log(i);
}
// 1, 2, 3 이 차례로 나옴</code></pre>
      </div>
      <p>👉 <b>1부터 5까지</b> 숫자를 차례로 출력해보세요.</p>`,
    start: 'for (let i = 1; i <= 3; i++) {\n  console.log(i);\n}',
    check: (out) => ["1","2","3","4","5"].every(n => out.includes(n))
  },
  {
    id: "func", group: "중급", title: "6. 함수 — 기능 묶기",
    body: `
      <p class="lead">자주 쓰는 코드를 <b>이름 붙여 묶어두고</b> 필요할 때 부르는 게 함수예요.</p>
      <div class="card">
        <h3>함수 만들고 부르기</h3>
        <pre><code>function hello(name) {
  console.log("안녕, " + name);
}
hello("영희");   // 안녕, 영희</code></pre>
      </div>
      <p>👉 <code>hello</code> 함수를 본인 이름으로 한 번 더 불러보세요.</p>`,
    start: 'function hello(name) {\n  console.log("안녕, " + name);\n}\nhello("영희");',
    check: (out) => out.split("안녕,").length >= 3
  },
  // ===== 심화 =====
  {
    id: "array", group: "심화", title: "7. 배열 — 목록 다루기",
    body: `
      <p class="lead">여러 값을 하나의 <b>목록</b>으로 묶는 게 배열이에요.</p>
      <div class="card">
        <h3>배열과 반복</h3>
        <pre><code>let fruits = ["사과", "바나나", "포도"];
for (let f of fruits) {
  console.log(f);
}</code></pre>
      </div>
      <p>👉 좋아하는 음식 3개를 배열에 넣고 하나씩 출력해보세요.</p>`,
    start: 'let foods = ["", "", ""];\nfor (let f of foods) {\n  console.log(f);\n}',
    check: (out) => out.trim().split("\n").filter(l => l.trim()).length >= 3
  },
  {
    id: "object", group: "심화", title: "8. 객체 — 정보 묶기",
    body: `
      <p class="lead">하나의 대상이 가진 여러 정보를 묶을 땐 객체를 써요. (이름·나이·취미...)</p>
      <div class="card">
        <h3>객체 만들기</h3>
        <pre><code>let person = {
  name: "철수",
  age: 15
};
console.log(person.name + "은 " + person.age + "살");</code></pre>
      </div>
      <p>👉 본인을 나타내는 객체를 만들고, "이름은 N살" 형식으로 출력해보세요.</p>`,
    start: 'let me = {\n  name: "",\n  age: 0\n};\nconsole.log( );',
    check: (out) => /살/.test(out)
  },
  {
    id: "project", group: "심화", title: "9. 미니 프로젝트 — 짝수 찾기",
    body: `
      <p class="lead">지금까지 배운 걸 합쳐 작은 프로그램을 만들어봐요. 🎉</p>
      <div class="card">
        <h3>도전 과제</h3>
        <p><b>1부터 10까지</b> 중에서 <b>짝수만</b> 출력하세요.</p>
        <p>힌트: 반복문 + 조건문 + <code>%</code> (나머지). <code>i % 2 === 0</code> 이면 짝수예요.</p>
        <pre><code>// i % 2 는 i를 2로 나눈 나머지</code></pre>
      </div>
      <p>👉 결과로 2, 4, 6, 8, 10 이 나오면 성공!</p>`,
    start: 'for (let i = 1; i <= 10; i++) {\n  // 여기에 조건문을 넣어보세요\n}',
    check: (out) => {
      const nums = out.match(/\d+/g) || [];
      return ["2","4","6","8","10"].every(n => nums.includes(n)) && !nums.includes("1") && !nums.includes("3");
    }
  }
];

/* ---------------- 상태 / 저장 ---------------- */
const STORE_KEY = "coding-first-step-progress";
let done = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
let current = 0;

function save() { localStorage.setItem(STORE_KEY, JSON.stringify(done)); }

/* ---------------- 사이드바 ---------------- */
function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  let lastGroup = null;
  LESSONS.forEach((les, i) => {
    if (les.group !== lastGroup) {
      const g = document.createElement("div");
      g.className = "group-title";
      g.textContent = les.group;
      nav.appendChild(g);
      lastGroup = les.group;
    }
    const b = document.createElement("button");
    b.className = "lesson-btn" + (i === current ? " active" : "") + (done[les.id] ? " done" : "");
    b.innerHTML = `<span class="dot"></span><span>${les.title}</span>`;
    b.onclick = () => { current = i; render(); };
    nav.appendChild(b);
  });
  // 진도율
  const total = LESSONS.length;
  const cnt = LESSONS.filter(l => done[l.id]).length;
  document.getElementById("progbar").style.width = (cnt / total * 100) + "%";
  document.getElementById("progtext").textContent = `${cnt} / ${total} 완료`;
}

/* ---------------- 본문 ---------------- */
function render() {
  renderNav();
  const les = LESSONS[current];
  const main = document.getElementById("main");
  main.innerHTML = `
    <h2>${les.title}</h2>
    ${les.body}
    <div class="editor-label">✏️ 직접 코드를 써보세요</div>
    <textarea class="editor" id="code" spellcheck="false">${les.start}</textarea>
    <div class="row">
      <button class="btn" id="run">▶ 실행</button>
      <button class="btn ghost" id="reset">처음으로</button>
    </div>
    <div class="output" id="output">실행 결과가 여기에 나와요</div>
    <div class="feedback" id="feedback"></div>
    <div class="nav-foot">
      <button class="btn ghost" id="prev" ${current === 0 ? "disabled" : ""}>← 이전</button>
      <button class="btn ghost" id="next" ${current === LESSONS.length - 1 ? "disabled" : ""}>다음 →</button>
    </div>
  `;
  document.getElementById("run").onclick = runCode;
  document.getElementById("reset").onclick = () => { document.getElementById("code").value = les.start; };
  document.getElementById("prev").onclick = () => { if (current > 0) { current--; render(); } };
  document.getElementById("next").onclick = () => { if (current < LESSONS.length - 1) { current++; render(); } };
  // 탭 키로 들여쓰기
  document.getElementById("code").addEventListener("keydown", (e) => {
    if (e.key === "Tab") { e.preventDefault();
      const t = e.target, s = t.selectionStart;
      t.value = t.value.slice(0, s) + "  " + t.value.slice(t.selectionEnd);
      t.selectionStart = t.selectionEnd = s + 2;
    }
  });
  window.scrollTo(0, 0);
}

/* ---------------- 코드 실행 (안전한 출력 캡처) ---------------- */
function runCode() {
  const code = document.getElementById("code").value;
  const out = document.getElementById("output");
  const fb = document.getElementById("feedback");
  const logs = [];
  const fakeConsole = { log: (...a) => logs.push(a.map(String).join(" ")) };
  let error = null;
  try {
    const fn = new Function("console", code);
    fn(fakeConsole);
  } catch (e) { error = e.message; }

  const text = logs.join("\n");
  if (error) {
    out.textContent = "⚠️ 오류: " + error;
    out.style.color = "var(--err)";
  } else {
    out.textContent = text || "(출력된 내용이 없어요)";
    out.style.color = "#cfd6e4";
  }

  // 정답 체크
  const les = LESSONS[current];
  if (!error && les.check(text, code)) {
    fb.className = "feedback show ok";
    fb.textContent = "🎉 정답이에요! 다음 레슨으로 넘어가 보세요.";
    if (!done[les.id]) { done[les.id] = true; save(); renderNav(); }
  } else if (!error) {
    fb.className = "feedback show no";
    fb.textContent = "거의 다 왔어요! 결과를 보고 조금만 더 고쳐보세요.";
  } else {
    fb.className = "feedback";
  }
}

render();
</script>
</body>
</html>
