<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>코드 미니게임 — 배운 걸로 플레이</title>
<style>
  :root{
    --bg:#0f1117;--panel:#1a1d27;--panel2:#232733;--line:#2e3342;
    --text:#e6e9f0;--muted:#9aa3b2;--accent:#5b8cff;--accent2:#7c5cff;
    --ok:#36c98f;--warn:#ffb454;--err:#ff6b6b;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
  header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,rgba(124,92,255,.10),rgba(91,140,255,.10));}
  header h1{font-size:18px;margin:0;}
  header .sub{color:var(--muted);font-size:13px;}
  header a.home{margin-left:auto;color:var(--accent);text-decoration:none;font-size:14px;border:1px solid var(--line);padding:7px 12px;border-radius:8px;}
  header a.home:hover{background:var(--panel2);}

  .layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 63px);}
  @media (max-width:820px){.layout{grid-template-columns:1fr;}}
  nav{border-right:1px solid var(--line);padding:16px 10px;overflow-y:auto;}
  .group-title{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:16px 10px 6px;}
  .game-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;color:var(--text);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;}
  .game-btn:hover{background:var(--panel2);}
  .game-btn.active{background:var(--panel2);color:#fff;font-weight:600;}
  .game-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;}
  .game-btn.done .dot{background:var(--ok);}
  .game-btn.locked{opacity:.5;}

  main{padding:26px 30px;max-width:880px;}
  h2{font-size:23px;margin:0 0 4px;}
  .lead{color:var(--muted);margin-top:0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:16px 0;}
  .card h3{margin:0 0 8px;font-size:15px;}
  code{background:var(--panel2);padding:2px 6px;border-radius:5px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13px;}
  pre{background:#0b0d13;border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;}
  pre code{background:none;padding:0;}

  .stage{background:#0b0d13;border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
  .grid{display:grid;gap:4px;}
  .cell{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border-radius:8px;font-size:22px;}
  .cell.path{background:#243056;}
  .stars{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:20px;letter-spacing:3px;color:var(--warn);line-height:1.3;text-align:left;}
  .runner-track{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .ob{padding:8px 10px;border-radius:8px;background:var(--panel2);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;}
  .ob.good{background:rgba(54,201,143,.18);}
  .ob.bad{background:rgba(255,107,107,.18);}
  .mon{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .mon .m{background:var(--panel2);border-radius:10px;padding:10px 14px;text-align:center;font-size:13px;}
  .mon .m b{font-size:22px;display:block;}

  .editor-label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:6px;}
  textarea.editor{width:100%;min-height:150px;resize:vertical;background:#0b0d13;color:#e6e9f0;border:1px solid var(--line);border-radius:10px;padding:14px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:14px;line-height:1.6;tab-size:2;}
  .row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  button.btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;}
  button.btn:hover{filter:brightness(1.08);}
  button.ghost{background:var(--panel2);color:var(--text);}
  .output{margin-top:12px;background:#0b0d13;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap;min-height:22px;color:#cfd6e4;}
  .feedback{margin-top:10px;font-size:14px;padding:10px 14px;border-radius:9px;display:none;}
  .feedback.show{display:block;}
  .feedback.ok{background:rgba(54,201,143,.12);color:var(--ok);border:1px solid rgba(54,201,143,.3);}
  .feedback.no{background:rgba(255,107,107,.1);color:var(--err);border:1px solid rgba(255,107,107,.3);}
  .lockbox{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted);}
  .progress-pill{margin-left:auto;font-size:12px;color:var(--muted);}
  footer{color:var(--muted);font-size:12px;padding:16px 30px;border-top:1px solid var(--line);}
</style>
</head>
<body>
<header>
  <div>
    <h1>🎮 코드 미니게임</h1>
    <div class="sub">배운 코딩으로 직접 플레이하기 · 적응 → 발전 → 심화</div>
  </div>
  <a class="home" href="index.html">📚 학습으로</a>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<footer>각 게임은 코드로 클리어해요. 학습 진도가 쌓이면 다음 레벨이 열립니다. 클리어 기록은 자동 저장됩니다.</footer>

<script>
/* ====================================================================
   진도 연동: 학습 사이트(index.html)와 같은 저장소를 읽어 잠금 해제
==================================================================== */
const LESSON_KEY = "coding-first-step-progress";
const lessonDone = JSON.parse(localStorage.getItem(LESSON_KEY) || "{}");
const groupAllDone = (ids) => ids.every(id => lessonDone[id]);
const BASIC_DONE = groupAllDone(["intro","var","type"]);   // 기초 완료?
const MID_DONE   = groupAllDone(["if","loop","func"]);      // 중급 완료?

/* 게임 클리어 저장소 */
const GAME_KEY = "coding-games-clear";
let cleared = JSON.parse(localStorage.getItem(GAME_KEY) || "{}");
const saveClear = () => localStorage.setItem(GAME_KEY, JSON.stringify(cleared));
/* 사용자가 직접 잠금 해제한 레벨 기억 */
const FORCE_KEY = "coding-games-force";
let forced = JSON.parse(localStorage.getItem(FORCE_KEY) || "{}");
const saveForce = () => localStorage.setItem(FORCE_KEY, JSON.stringify(forced));

/* ====================================================================
   공통 실행기: 사용자 코드를 안전하게 실행하고 console.log 캡처
   extra: 게임이 코드에 주입할 전역(함수/값)
==================================================================== */
function execute(code, extra = {}) {
  const logs = [];
  const fakeConsole = { log: (...a) => logs.push(a.map(String).join(" ")) };
  const names = ["console", ...Object.keys(extra)];
  const vals  = [fakeConsole, ...Object.values(extra)];
  let error = null;
  try { new Function(...names, code)(...vals); }
  catch (e) { error = e.message; }
  return { logs, text: logs.join("\n"), error };
}

/* ====================================================================
   게임 정의
   각 게임: id, group(적응/발전/심화), need(잠금조건), title, goal(html),
            start(시작코드), play(code, ctx) — 실행/렌더/승패 판정
   ctx: { stage(html), out(text,isErr), win(), fail(msg) }
==================================================================== */
const GAMES = [
  /* ---------- 적응 ---------- */
  {
    id:"robot", group:"적응", need:"always", title:"🤖 로봇 길찾기",
    goal:`<p class="lead">로봇을 <b>출발(왼쪽 위)</b>에서 <b>깃발(오른쪽 아래)</b>까지 보내세요.</p>
      <div class="card"><h3>사용할 수 있는 명령</h3>
      <p><code>right()</code> 오른쪽 · <code>left()</code> 왼쪽 · <code>up()</code> 위 · <code>down()</code> 아래</p>
      <p>5×5 칸이에요. 명령을 순서대로 적으면 그 순서로 움직여요.</p></div>`,
    start:"// 예시: right(); 를 여러 번 써보세요\nright();\ndown();\n",
    play(code, ctx){
      const N=5; let r=0,c=0; const path=[[0,0]];
      const step=(dr,dc)=>{ r+=dr; c+=dc; path.push([r,c]); };
      const ex=execute(code,{
        right:()=>step(0,1), left:()=>step(0,-1), up:()=>step(-1,0), down:()=>step(1,0)
      });
      if(ex.error){ ctx.out("⚠️ 오류: "+ex.error,true); return; }
      // 경계 이탈 체크
      const out = path.some(([y,x])=>y<0||y>=N||x<0||x>=N);
      // 그리드 렌더
      let html='<div class="grid" style="grid-template-columns:repeat('+N+',44px)">';
      for(let y=0;y<N;y++)for(let x=0;x<N;x++){
        const onPath=path.some(([py,px])=>py===y&&px===x);
        let face=''; if(y===r&&x===c)face='🤖'; else if(y===N-1&&x===N-1)face='🏁';
        html+=`<div class="cell ${onPath?'path':''}">${face}</div>`;
      }
      html+='</div>';
      ctx.stage(html);
      ctx.out(`이동 횟수: ${path.length-1}회`);
      if(out){ ctx.fail("벽 밖으로 나갔어요! 칸 안에서만 움직여 보세요."); return; }
      if(r===N-1&&c===N-1) ctx.win(); else ctx.fail("아직 깃발에 닿지 않았어요. 오른쪽·아래로 더 가볼까요?");
    },
  },
  {
    id:"safe", group:"적응", need:"always", title:"🔢 숫자 금고",
    goal:`<p class="lead">금고 비밀번호와 똑같은 숫자를 <b>계산해서</b> 출력하면 열려요.</p>
      <div class="card"><h3>방법</h3>
      <p>변수와 사칙연산(<code>+ - * /</code>)을 써서 목표 숫자를 만든 뒤 <code>console.log</code> 하세요.</p>
      <pre><code>let a = 6;
let b = 7;
console.log(a * b);   // 42</code></pre></div>`,
    target:42,
    start:"let a = \nlet b = \nconsole.log( );",
    play(code, ctx){
      const t=this.target;
      ctx.stage(`<div style="font-size:40px">🔒</div><div>금고 비밀번호: <b style="color:var(--warn);font-size:22px">${t}</b></div>`);
      const ex=execute(code);
      if(ex.error){ ctx.out("⚠️ 오류: "+ex.error,true); return; }
      ctx.out(ex.text||"(출력 없음)");
      const nums=(ex.text.match(/-?\d+(\.\d+)?/g)||[]).map(Number);
      if(nums.includes(t)){
        ctx.stage(`<div style="font-size:40px">🔓</div><div style="color:var(--ok)">금고가 열렸다!</div>`);
        ctx.win();
      } else ctx.fail(`아직이에요. ${t} 을(를) 만들어 출력해 보세요.`);
    },
  },
  /* ---------- 발전 ---------- */
  {
    id:"pyramid", group:"발전", need:"basic", title:"⭐ 별 피라미드",
    goal:`<p class="lead">반복문으로 별(<code>*</code>) 피라미드를 쌓으세요. (4줄 이상)</p>
      <div class="card"><h3>목표 모양</h3>
      <pre><code>*
**
***
****</code></pre>
      <p>힌트: <code>"*".repeat(i)</code> 는 별을 i개 만들어요.</p></div>`,
    start:"for (let i = 1; i <= 4; i++) {\n  console.log( );\n}",
    play(code, ctx){
      const ex=execute(code);
      if(ex.error){ ctx.out("⚠️ 오류: "+ex.error,true); return; }
      const lines=ex.logs.map(l=>l.replace(/\s+$/,"")).filter(l=>l.length);
      ctx.stage(`<div class="stars">${lines.map(l=>l.replace(/</g,"&lt;")).join("<br>")||"(빈 화면)"}</div>`);
      const ok = lines.length>=4 &&
        lines.every((l,i)=> /^\*+$/.test(l) && l.length===i+1);
      if(ok) ctx.win(); else ctx.fail("1줄=별1개, 2줄=별2개... 처럼 한 줄씩 늘려 4줄 이상 만들어 보세요.");
    },
  },
  {
    id:"runner", group:"발전", need:"basic", title:"🏃 장애물 달리기",
    goal:`<p class="lead">장애물마다 알맞은 동작을 해야 통과해요. <b>벽은 점프, 천장은 숙이기!</b></p>
      <div class="card"><h3>사용법</h3>
      <p><code>obstacles</code> 배열을 반복하면서 조건문으로 판단하세요.</p>
      <p><code>jump()</code> 점프 · <code>duck()</code> 숙이기</p>
      <pre><code>for (let o of obstacles) {
  if (o === "벽") jump();
  else duck();
}</code></pre></div>`,
    course:["벽","천장","벽","벽","천장","벽"],
    start:'for (let o of obstacles) {\n  // 벽이면 jump(), 천장이면 duck()\n}',
    play(code, ctx){
      const course=this.course; const acts=[];
      const ex=execute(code,{ obstacles:course.slice(), jump:()=>acts.push("jump"), duck:()=>acts.push("duck") });
      if(ex.error){ ctx.out("⚠️ 오류: "+ex.error,true); return; }
      // 각 장애물 통과 판정
      let html='<div class="runner-track">';
      let allOk = acts.length===course.length;
      course.forEach((o,i)=>{
        const need = o==="벽" ? "jump" : "duck";
        const got = acts[i];
        const ok = got===need;
        if(!ok) allOk=false;
        const icon = o==="벽" ? "🧱" : "🔻";
        const did = got==="jump"?"⬆️ 점프":got==="duck"?"⬇️ 숙임":"❓";
        html+=`<div class="ob ${got?(ok?'good':'bad'):''}">${icon} ${o}<small>${did}</small></div>`;
      });
      html+='</div>';
      ctx.stage(html);
      ctx.out(`동작 ${acts.length}개 / 장애물 ${course.length}개`);
      if(allOk) ctx.win(); else ctx.fail("순서대로 장애물마다 맞는 동작을 해주세요. (벽=점프, 천장=숙이기)");
    },
  },
  /* ---------- 심화 ---------- */
  {
    id:"treasure", group:"심화", need:"mid", title:"💎 보물 수집",
    goal:`<p class="lead">지도( <code>map</code> )에 숨은 보물 값을 <b>모두 더한 총합</b>을 출력하세요.</p>
      <div class="card"><h3>지도</h3>
      <p><code>map</code> 은 숫자가 든 2차원 배열이에요. 0은 빈 칸, 숫자는 보물 값.</p>
      <pre><code>let total = 0;
for (let row of map) {
  for (let v of row) {
    total = total + v;
  }
}
console.log(total);</code></pre></div>`,
    map:[[0,5,0],[3,0,7],[0,2,0]],
    start:'let total = 0;\n// map 을 두 번 반복해서 다 더해보세요\nconsole.log(total);',
    play(code, ctx){
      const map=this.map.map(r=>r.slice());
      const sum=map.flat().reduce((a,b)=>a+b,0);
      // 렌더
      let html='<div class="grid" style="grid-template-columns:repeat('+map[0].length+',44px)">';
      map.forEach(row=>row.forEach(v=>{ html+=`<div class="cell">${v>0?"💎":"·"}</div>`; }));
      html+=`</div><small style="color:var(--muted)">보물 총합은 ${sum} 이에요</small>`;
      ctx.stage(html);
      const ex=execute(code,{ map:map });
      if(ex.error){ ctx.out("⚠️ 오류: "+ex.error,true); return; }
      ctx.out(ex.text||"(출력 없음)");
      const nums=(ex.text.match(/-?\d+/g)||[]).map(Number);
      if(nums.includes(sum)) ctx.win(); else ctx.fail(`총합 ${sum} 이 나오도록 두 번(행·열) 반복해 더해보세요.`);
    },
  },
  {
    id:"battle", group:"심화", need:"mid", title:"⚔️ 몬스터 배틀",
    goal:`<p class="lead">모든 몬스터를 쓰러뜨리는 데 필요한 <b>총 공격 횟수</b>를 계산해 출력하세요.</p>
      <div class="card"><h3>규칙</h3>
      <p>내 공격력 <code>power</code> 는 10. 한 번 때리면 몬스터 hp가 10 줄어요.</p>
      <p>몬스터마다 필요한 횟수 = <code>Math.ceil(hp / power)</code>. 모두 더하면 정답!</p>
      <pre><code>let total = 0;
for (let m of monsters) {
  total = total + Math.ceil(m.hp / power);
}
console.log(total);</code></pre></div>`,
    monsters:[{name:"슬라임",hp:20},{name:"고블린",hp:35},{name:"드래곤",hp:100}],
    start:'let total = 0;\n// monsters 를 돌면서 필요한 공격 횟수를 더하세요\nconsole.log(total);',
    play(code, ctx){
      const monsters=this.monsters.map(m=>({...m})); const power=10;
      const need=monsters.reduce((a,m)=>a+Math.ceil(m.hp/power),0);
      const faces={슬라임:"🟢",고블린:"👺",드래곤:"🐉"};
      let html='<div class="mon">'+monsters.map(m=>`<div class="m"><b>${faces[m.name]||"👾"}</b>${m.name}<br>hp ${m.hp}</div>`).join('')+'</div>';
      ctx.stage(html);
      const ex=execute(code,{ monsters:monsters, power:power, Math:Math });
      if(ex.error){ ctx.out("⚠️ 오류: "+ex.error,true); return; }
      ctx.out(ex.text||"(출력 없음)");
      const nums=(ex.text.match(/-?\d+/g)||[]).map(Number);
      if(nums.includes(need)){
        ctx.stage(html+'<div style="margin-top:8px;color:var(--ok)">전부 물리쳤다! 🏆</div>');
        ctx.win();
      } else ctx.fail(`정답은 총 ${need}회예요. 각 몬스터의 hp ÷ 10 을 올림해서 더해보세요.`);
    },
  },
];

/* ====================================================================
   잠금 판단
==================================================================== */
function isUnlocked(g){
  if(g.need==="always") return true;
  if(forced[g.need]) return true;
  if(g.need==="basic") return BASIC_DONE;
  if(g.need==="mid")   return MID_DONE;
  return true;
}
const needLabel = { basic:"기초 3개 레슨", mid:"중급 3개 레슨" };

let current = 0;

/* ====================================================================
   사이드바
==================================================================== */
function renderNav(){
  const nav=document.getElementById("nav"); nav.innerHTML="";
  let lastG=null;
  GAMES.forEach((g,i)=>{
    if(g.group!==lastG){
      const t=document.createElement("div"); t.className="group-title"; t.textContent=g.group; nav.appendChild(t); lastG=g.group;
    }
    const b=document.createElement("button");
    const locked=!isUnlocked(g);
    b.className="game-btn"+(i===current?" active":"")+(cleared[g.id]?" done":"")+(locked?" locked":"");
    b.innerHTML=`<span class="dot"></span><span>${g.title}</span>`+(locked?'<span style="margin-left:auto">🔒</span>':(cleared[g.id]?'<span style="margin-left:auto">✅</span>':''));
    b.onclick=()=>{ current=i; render(); };
    nav.appendChild(b);
  });
  const total=GAMES.length, cnt=GAMES.filter(g=>cleared[g.id]).length;
  const p=document.createElement("div");
  p.className="group-title"; p.style.marginTop="22px";
  p.textContent=`클리어 ${cnt} / ${total}`;
  nav.appendChild(p);
}

/* ====================================================================
   본문
==================================================================== */
function render(){
  renderNav();
  const g=GAMES[current];
  const main=document.getElementById("main");

  if(!isUnlocked(g)){
    main.innerHTML=`
      <h2>${g.title} 🔒</h2>
      <div class="lockbox">
        <div style="font-size:40px">🔒</div>
        <p>이 게임은 <b>${needLabel[g.need]||"이전 단계"}</b>를 끝내면 열려요.<br>
        먼저 학습으로 가서 연습하고 오면 더 쉬워요!</p>
        <div class="row" style="justify-content:center">
          <a class="btn" href="index.html">📚 학습하러 가기</a>
          <button class="btn ghost" id="force">그래도 지금 도전할래요</button>
        </div>
      </div>`;
    document.getElementById("force").onclick=()=>{ forced[g.need]=true; saveForce(); render(); };
    window.scrollTo(0,0);
    return;
  }

  main.innerHTML=`
    <h2>${g.title} ${cleared[g.id]?'<span style="font-size:15px;color:var(--ok)">✅ 클리어</span>':''}</h2>
    ${g.goal}
    <div class="stage" id="stage"><span style="color:var(--muted)">[실행]을 누르면 여기에 결과가 보여요</span></div>
    <div class="editor-label">✏️ 코드를 작성하고 실행하세요</div>
    <textarea class="editor" id="code" spellcheck="false">${g.start}</textarea>
    <div class="row">
      <button class="btn" id="run">▶ 실행</button>
      <button class="btn ghost" id="reset">처음으로</button>
    </div>
    <div class="output" id="output"></div>
    <div class="feedback" id="feedback"></div>
    <div class="row" style="justify-content:space-between;margin:26px 0 50px">
      <button class="btn ghost" id="prev" ${current===0?"disabled":""}>← 이전</button>
      <button class="btn ghost" id="next" ${current===GAMES.length-1?"disabled":""}>다음 →</button>
    </div>`;

  const stageEl=document.getElementById("stage");
  const outEl=document.getElementById("output");
  const fbEl=document.getElementById("feedback");
  const ctx={
    stage:(html)=>{ stageEl.innerHTML=html; },
    out:(text,isErr)=>{ outEl.textContent=text; outEl.style.color=isErr?"var(--err)":"#cfd6e4"; },
    win:()=>{ fbEl.className="feedback show ok"; fbEl.textContent="🎉 클리어! 멋져요. 다음 게임에 도전해 보세요.";
              if(!cleared[g.id]){ cleared[g.id]=true; saveClear(); renderNav(); } },
    fail:(msg)=>{ fbEl.className="feedback show no"; fbEl.textContent=msg; },
  };

  document.getElementById("run").onclick=()=>{
    fbEl.className="feedback"; outEl.textContent="";
    g.play(document.getElementById("code").value, ctx);
  };
  document.getElementById("reset").onclick=()=>{ document.getElementById("code").value=g.start; };
  document.getElementById("prev").onclick=()=>{ if(current>0){current--;render();} };
  document.getElementById("next").onclick=()=>{ if(current<GAMES.length-1){current++;render();} };
  document.getElementById("code").addEventListener("keydown",(e)=>{
    if(e.key==="Tab"){ e.preventDefault(); const t=e.target,s=t.selectionStart;
      t.value=t.value.slice(0,s)+"  "+t.value.slice(t.selectionEnd); t.selectionStart=t.selectionEnd=s+2; }
  });
  window.scrollTo(0,0);
}

render();
</script>
</body>
</html>
